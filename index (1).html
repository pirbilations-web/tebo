function survAct(p,c,dt){let still=false;p.rep=null;

const reach=p=>p.kind==='veli'?3.8:2.7;

function dmg(p,t){p.hits++;t.hp--;if(t.hp<=0)down(t);else{t.boost=BT;t.inv=.4;toastP(t,'Hasar aldın! Kaç!')}}
function strike(p,must){const fx=Math.sin(p.face),fz=Math.cos(p.face),dash=!must,rc=reach(p);let t=null;
 for(const q of G.P){if(q.killer||q.st!=='ok'||q.inv>0)continue;const dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz)||.001;if(d<rc&&(d<.9||(dx*fx+dz*fz)/d>(dash?-.3:.2))&&los(p,q)){t=q;break}}

function hatThrow(p){p.ac2=4;p.swing=.35;G.proj.push({x:p.x+Math.sin(p.face)*.8,z:p.z+Math.cos(p.face)*.8,dx:Math.sin(p.face),dz:Math.cos(p.face),t:0})}

function aimOf(p,list,maxd,min){let b=null,bs=min;list.forEach((o,i)=>{const dx=o.x-p.x,dz=o.z-p.z,d=Math.hypot(dx,dz);if(d<4||d>maxd)return;const s=(dx*Math.sin(p.face)+dz*Math.cos(p.face))/d;if(s>bs){bs=s;b=i}});return b===null?-1:b}
function veliTp(p,hk){const i=hk!==undefined?hk:aimOf(p,G.pikes,200,.3);if(i<0)return;const k=G.pikes[i],m=Math.hypot(k.x,k.z)||1;p.x=k.x-k.x/m*2.8;p.z=k.z-k.z/m*2.8;res(p);p.ac=25;p.tpt=.4;toast('Veli ışınlandı!')}

function killAct(p,c,dt){p.cd=Math.max(0,p.cd-dt);p.abl=Math.max(0,p.abl-dt);p.ac=Math.max(0,p.ac-dt);p.ac2=Math.max(0,p.ac2-dt);const kd=p.kind;
 if(kd==='smooth'&&p.mw){if(c.atk&&p.ac2<=0&&!p.carry)hatThrow(p)}
 else if(c.atk&&p.cd<=0&&!p.carry)strike(p,true);
 else if(kd==='crawler'&&p.abl>0&&p.cd<=0&&!p.carry)strike(p,false);
 if(c.abl){if(kd==='crawler'){if(p.ac<=0){p.abl=1.1;p.ac=10}}else if(kd==='smooth'){if(p.mw)mwEnd(p);else if(p.ac<=0&&!p.carry){p.mw=true;p.mwd=p.face}}else if(kd==='veli'&&p.ac<=0)veliTp(p,c.hk)}
 if(c.ab2&&kd==='veli'&&p.ac2<=0)fistTrig(p,c.fp);
 if(c.ip){if(p.carry){const k=G.pikes.find(k=>!k.occ&&d2(p,k)<9);if(k)hang(p,k)}
  else{const q=G.P.find(q=>q.st==='down'&&d2(p,q)<6);if(q){mwEnd(p);q.st='carried';p.carry=q}
   else{const pa=G.pals.find(a=>a.st==='down'&&palNear(a,p,1.8));if(pa){p.brk=1.6;p.bp=pa}else{const w=G.wins.find(w=>d2(p,w)<5);if(w&&kd!=='veli')winVault(p,w)}}}}

function step(p,c,dt){
 if(p.inv>0)p.inv-=dt;if(p.boost>0)p.boost-=dt;if(p.swing>0)p.swing-=dt;
 if(p.st==='hung'){p.sink+=dt*(p.hangs>=3?1/SINK3:1/SINK);if(p.sink>=1)die(p);return}
 if(p.st!=='ok')return;
 if(p.vt>0){p.vt-=dt;const k=1-Math.max(0,p.vt)/p.vd;p.x=p.va.x+(p.vb.x-p.va.x)*k;p.z=p.va.z+(p.vb.z-p.va.z)*k;p.vy=p.vt>0?Math.sin(Math.PI*k)*(p.vk===2?.15:.7):0;return}
 if(p.stun>0){p.stun-=dt;p.mw=false;return}
 if(p.brk>0){p.brk-=dt;if(p.brk<=0&&p.bp&&p.bp.st==='down')palBreak(p.bp);return}
 const still=p.killer?(killAct(p,c,dt),false):survAct(p,c,dt);

 if(l>.05&&!still){const k=Math.min(1,l);p.x+=c.x/l*k*sp*dt;p.z+=c.z/l*k*sp*dt;if(!(p.killer&&(p===me||p.net==='remote')))p.face=Math.atan2(c.x,c.z)}

function world(dt){if(G.end)return;G.t+=dt;
 for(const q of G.P)if(q.st==='carried'){q.x=G.killer.x;q.z=G.killer.z}
 if(!G.open){G.time-=dt;if(G.time<=0){G.time=0;openDoor()}}else if((G.over-=dt)<=0)for(const q of G.P)if(!q.killer&&ALIVE.includes(q.st))die(q);
 for(const g of G.gens){g.al=Math.max(0,g.al-dt);g.b.visible=g.al>0&&!g.done}
 for(const d of G.deps){if(d.busy>0){d.busy-=dt}else d.prog=Math.max(0,d.prog-dt*.6)}
 for(const p of G.P)if(p.sc){if(p.rep!==p.sc.g)p.sc=null;else if((p.sc.t+=dt/1.6)>=1){skApply(p,p.sc.g,false);p.sc=null}}
 for(let i=G.proj.length-1;i>=0;i--){const o=G.proj[i];o.t+=dt;o.x+=o.dx*32*dt;o.z+=o.dz*32*dt;let hit=o.t>.85||G.col.some(c=>!c.w&&!c.lo&&Math.abs(o.x-c.x)<c.hw&&Math.abs(o.z-c.z)<c.hd);
  if(!hit)for(const q of G.P)if(!q.killer&&q.st==='ok'&&q.inv<=0&&Math.hypot(q.x-o.x,q.z-o.z)<1){dmg(G.killer,q);hit=true;break}
  if(hit)G.proj.splice(i,1)}

function mv(p,tx,tz,c,dt,stop){tx=cl(tx,-S+2.5,S-2.5);tz=cl(tz,-S+2.5,S-2.5);let dx=tx-p.x,dz=tz-p.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
 if(l>4){const pd=6;dx-=(p.x>S-pd?(p.x-S+pd)/pd:p.x<-S+pd?(p.x+S-pd)/pd:0)*1.5;dz-=(p.z>S-pd?(p.z-S+pd)/pd:p.z<-S+pd?(p.z+S-pd)/pd:0)*1.5;const m=Math.hypot(dx,dz)||1;dx/=m;dz/=m}
 p.sa+=dt;if(p.sa>.6){if(Math.hypot(p.x-p.lx,p.z-p.lz)<.6&&l>1.5){p.sideT=.9;p.sd=Math.random()<.5?1:-1}p.lx=p.x;p.lz=p.z;p.sa=0}
 if(p.sideT>0){p.sideT-=dt;const a=p.sd*1.3,cs=Math.cos(a),sn=Math.sin(a);[dx,dz]=[dx*cs-dz*sn,dx*sn+dz*cs]}
 if(p.dv>0){p.dv-=dt;const cs=Math.cos(p.da),sn=Math.sin(p.da);[dx,dz]=[dx*cs-dz*sn,dx*sn+dz*cs]}
 else if(l>2.5)for(const a0 of[0,.7,-.7,1.4,-1.4,2.2]){const a=a0*p.sd,cs=Math.cos(a),sn=Math.sin(a),ex=dx*cs-dz*sn,ez=dx*sn+dz*cs,ok=r=>{const fx=p.x+ex*r,fz=p.z+ez*r;return!inCol(fx,fz,.7,p)&&Math.abs(fx)<S-1.5&&Math.abs(fz)<S-1.5};
  if(ok(1.6)&&ok(3.4)){if(a0){p.dv=.7;p.da=a}dx=ex;dz=ez;break}}
 if(l>stop){c.x=dx;c.z=dz}}
function survBot(p,c,dt){const k=G.killer,dk=Math.sqrt(d2(p,k));
 if(dk<14){const ax=(p.x-k.x)/(dk||1),az=(p.z-k.z)/(dk||1),nr=Math.max(0,Math.max(Math.abs(p.x),Math.abs(p.z))-(S-10))/10,cm=Math.hypot(p.x,p.z)||1,cx=-p.x/cm,cz=-p.z/cm;
  let tx=-az,tz=ax;if(tx*cx+tz*cz<0){tx=-tx;tz=-tz}

function sync(dt){
 G.items.forEach((it,i)=>{if(!it.taken){it.m.rotation.y=G.t*1.2+i;it.m.position.y=.38+Math.sin(G.t*2+i)*.06}});
 for(const a of G.pals)if(a.st==='down'&&a.fa<1){a.fa=Math.min(1,a.fa+dt*3.2);a.f.rotation.x=a.ds*Math.PI/2*.94*a.fa*a.fa}
 for(const f of G.fists){f.rg.material.color.set(f.st===1?0xff2a2a:0x661111);f.rg.material.opacity=f.st===1?.5+.4*Math.sin(G.t*20):.35;let y=-9;if(f.st===2){const k=f.t;y=k<.15?-9+9*(k/.15):k<.65?0:-9*((k-.65)/.25)}f.m.position.y=y}
 while(HM.length<G.proj.length){const h=new THREE.Group(),a=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.05,12),mat(0x111114)),c=new THREE.Mesh(new THREE.CylinderGeometry(.28,.3,.28,10),mat(0x111114));c.position.y=.15;h.add(a,c);W.add(h);HM.push(h)}
 HM.forEach((h,i)=>{const o=G.proj[i];h.visible=!!o;if(o){h.position.set(o.x,1.4,o.z);h.rotation.y=G.t*20}})
 for(const d of G.deps){if(d.busy>0)d.ang+=dt*7;d.cr.rotation.x=d.ang;const by=.7+d.prog*1.4;d.bk.position.y=by;d.rp.position.y=(2.5+by)/2;d.rp.scale.y=2.5-by}
 for(const p of G.P){const m=p.m;m.visible=p.st!=='dead'&&p.st!=='esc'&&!(me.killer&&(p===me||p.st==='carried'));let y=0,rz=0,rx=0,x=p.x,z=p.z;
  if(p.st==='down'){rz=1.5;y=.45}else if(p.st==='carried'){rz=1.5;y=1.9}else if(p.st==='hung'){const k=G.pikes[p.pike];if(k){x=k.x;z=k.z}y=1-p.sink*2.4}
  else if(p.vt>0){y=p.vy||0;rx=p.vk===2?1.1:.5}else if(p.brk>0){rx=-.45*Math.sin(Math.PI*cl((1-p.brk/1.6)*1.6,0,1))}else if(p.stun>0){rz=Math.sin(G.t*30)*.15}else if(p.swing>0)rx=.5;
  if(p.killer&&p.kp){const kp=p.kp,mvg=Math.hypot(p.x-(p.sx??p.x),p.z-(p.sz??p.z))>.01;p.sx=p.x;p.sz=p.z;
   if(p.kind==='crawler')kp.claws.forEach(c=>c.scale.y=(p.swing>0||p.abl>0)?1.1:.25);
   else{const w=Math.sin(G.t*(p.mw?18:9))*(p.mw?.6:mvg?.5:0);kp.legs[0].rotation.x=w;kp.legs[1].rotation.x=-w;if(kp.kn)kp.kn.visible=!p.mw;if(p.mw&&!(p.vt>0))rx=-.25}
   if(p.tpt>0)m.visible=Math.floor(G.t*40)%2===0}
  m.position.set(x,y,z);m.rotation.set(rx,p.face,rz)}}
function camUpd(){let t=me;if(me.st==='dead'||me.st==='esc')t=G.P.find(q=>!q.killer&&ALIVE.includes(q.st))||G.killer;FL.position.set(t.x,3.2,t.z);
 if(t===me&&me.killer){const q=Math.cos(pit),ey=({crawler:1.7,smooth:2.1,veli:5.3})[me.kind]||1.9,ky=me.brk>0?.25*Math.sin(Math.PI*cl((1-me.brk/1.6)*1.6,0,1)):0;cam.position.set(t.x,ey-ky,t.z);cam.lookAt(t.x-Math.sin(yaw)*q,ey-ky-Math.sin(pit),t.z-Math.cos(yaw)*q);
  const fv=70+(me.abl>0||me.mw?14:0);if(Math.abs(cam.fov-fv)>.1){cam.fov+=(fv-cam.fov)*.2;cam.updateProjectionMatrix()}return}
 if(cam.fov!==70){cam.fov=70;cam.updateProjectionMatrix()}
 const D=7.5,cp=Math.cos(pit);cam.position.set(t.x+Math.sin(yaw)*cp*D,1.6+Math.sin(pit)*D,t.z+Math.cos(yaw)*cp*D);cam.lookAt(t.x,1.4,t.z)}
function hands(){HD.visible=me.killer&&me.st==='ok';if(!HD.visible)return;const hs=HS[me.kind];if(!hs){HD.visible=false;return}for(const k in HS)HS[k].g.visible=HS[k]===hs;
 const sw=me.swing>0,t=sw?1-me.swing/.35:1,s=sw?Math.sin(Math.PI*t):0,s2=sw?Math.sin(Math.PI*cl(t*1.3-.15,0,1)):0,mvg=Math.hypot(me.x-HD.px,me.z-HD.pz)>.02,b=mvg?Math.sin(G.t*8)*.02:0,ds=(me.abl>0||me.mw)?.12:0,kb=me.brk>0,up=me.carry?.08:kb?-.15:0,oy=me.kind==='veli'?-.12:0;HD.px=me.x;HD.pz=me.z;
 if(me.kind==='crawler')hs.R.userData.cw.concat(hs.L.userData.cw).forEach(c=>c.scale.y=(sw||me.abl>0)?.42:.05);
 if(hs.g.kn)hs.g.kn.visible=!me.mw;
 hs.R.position.set(.26-s*.5,-.28+oy+s*.1+up+b,-.5-s*.35-ds);hs.R.rotation.set(.2-s*.3,s*.9,0);hs.L.position.set(-.26+s2*.35,-.28+oy+up-b,-.5-s2*.3-ds);hs.L.rotation.set(.2,-s2*.6,0);
 HB.visible=kb;if(kb){const k=Math.sin(Math.PI*cl((1-me.brk/1.6)*1.6,0,1));HB.position.set(.2,-.95+k*.55,-.25-k*.9);HB.rotation.x=-k*.5}}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'),IC={ok:'🟢',down:'🔴',carried:'🩸',hung:'📍',dead:'💀',esc:'🚪'};
function kHint(){const a=me.ac>0?' ('+Math.ceil(me.ac)+' sn)':'',b=me.ac2>0?' ('+Math.ceil(me.ac2)+' sn)':'';
 if(me.kind==='smooth')return me.mw?'F: Şapka fırlat'+b+' • Boşluk: moonwalk bitir':'F: Bıçak • Boşluk: moonwalk'+a;
 if(me.kind==='veli')return'F: Pençe • Boşluk: kancaya ışınlan'+a+' • R: Yumruk'+b;return'Sol tık / F: vur • Boşluk: atılma'+a}
function hint(){if(me.st!=='ok')return{hung:'Kancadasın! Arkadaşların kurtarabilir ('+(3-me.hangs)+' hakkın kaldı)',down:'Yere düştün…',carried:'Katil seni taşıyor'}[me.st]||'İzleyici modundasın';
 if(me.stun>0)return'Sersemledin!';if(me.vt>0)return'';
 const dn=G.pals.find(a=>a.st==='down'&&palNear(a,me,me.killer?1.8:1.6)),w=G.wins.find(w=>d2(me,w)<5);
 if(me.killer){if(me.carry)return G.pikes.find(k=>!k.occ&&d2(me,k)<9)?'E: Kancaya as':'Boş bir kancaya götür (Q: bırak)';if(me.brk>0)return'Palet kırılıyor…';
  if(G.P.find(q=>q.st==='down'&&d2(me,q)<6))return'E: Yerdekini taşı';if(dn)return'E: Paleti tekmele';if(w&&me.kind!=='veli')return'E: Pencereden geç (yavaş)';return kHint()}
 if(G.P.find(q=>q.st==='hung'&&q.hangs<3&&d2(me,G.pikes[q.pike])<8))return'E basılı tut: Kurtar';
 if(G.gens.find(g=>!g.done&&d2(me,g)<7))return'E basılı tut: Jeneratörü çalıştır (Boşluk: kontrol)';
 if(me.item&&G.deps.some(d=>d2(me,d)<12))return'E basılı tut: Kolu çevir, eşyayı teslim et';
 if(G.pals.find(a=>a.st==='up'&&d2(me,a)<5))return'E: Paleti düşür';if(dn)return'E: Paletin üstünden kay';if(w)return'E: Pencereden atla';
 if(me.item)return'Eşyayı kuyuya götür (Q: bırak)';const it=G.items.find(i=>!i.taken&&d2(me,i)<4);return it?`E: Al — ${it.n} (${it.v})`:''}
function hud(){$('tm').textContent=(G.open?'KAPI AÇIK ':'')+fmt(G.open?G.over:G.time);$('gn').textContent='⚙ '+G.gens.filter(g=>g.done).length+'/4';
 $('mo').innerHTML=`💰 ${me.money} ${me.item?'<br>📦 '+me.item.n+' ('+me.item.v+')':''}`;
 $('pl2').innerHTML=G.P.filter(q=>!q.killer).map(q=>`${q.st==='ok'&&q.hp<2?'🟠':IC[q.st]} ${esc(q.name)}${q.hangs?' ('+q.hangs+'/3)':''}`).join('<br>');$('hn').textContent=hint();
 const rp=me.rep?me.rep.p:me.resc>0?me.resc/3:me.dep>0&&me.item?me.dep/(2.5+me.item.v/120):me.brk>0?1-me.brk/1.6:0;$('rpw').classList.toggle('hide',!rp);$('rp').style.width=rp*100+'%';
 const s=me.sc;$('sk').classList.toggle('hide',!s);if(s){$('skz').style.left=s.z*100+'%';$('skn').style.left=s.t*100+'%'}}

function remoteCmd(p){const r=p.rc||{},e=p.pend,c={x:r.x||0,z:r.z||0,ih:r.ih,ip:e.ip,atk:e.atk,abl:e.abl,ab2:e.ab2,drop:e.drop,sk:e.sk};p.pend={ip:0,atk:0,abl:0,ab2:0,drop:0,sk:0};if(p.killer&&r.f!==undefined)p.face=r.f;return c}
function hostFrame(dt){const hc=humanCmd();
 for(const p of G.P){let c;if(p===me)c=hc;else if(p.net==='remote')c=remoteCmd(p);else{c={x:0,z:0,ih:0,ip:0,atk:0,abl:0,drop:0,sk:0};if(p.st==='ok')p.killer?killBot(p,c,dt):survBot(p,c,dt)}step(p,c,dt)}
 world(dt);if(NET.cl.length){NET.sa+=dt;if(NET.sa>=.05){NET.sa=0;const s=snap();NET.cl.forEach(c=>sendU(c,s))}}}
function cliFrame(dt){const c=humanCmd();G.t+=dt;NET.acc+=dt;
 if(NET.acc>=.033){NET.acc=0;const m={m:'c',x:+c.x.toFixed(3),z:+c.z.toFixed(3),ih:c.ih?1:0,ip:netp.ip,atk:netp.atk,abl:netp.abl,ab2:netp.ab2,drop:netp.drop,sk:netp.sk,f:+me.face.toFixed(3)};
  netp.ip=netp.atk=netp.abl=netp.ab2=netp.drop=netp.sk=0;try{const x=NET.ru&&NET.ru.open?NET.ru:NET.conn;x&&x.open&&x.send(m)}catch(e){}}
 if(me.swing>0)me.swing-=dt;if(me.killer&&c.atk&&me.cd<=0&&me.swing<=0&&!me.carry&&me.st==='ok')me.swing=.35;
 if(me.sc)me.sc.t+=dt/1.6;for(const f of G.fists)if(f.st)f.t+=dt;
 for(const p of G.P){if(p.vt>0){p.vt-=dt;p.vy=p.vt>0?Math.sin(Math.PI*(1-p.vt/p.vd))*(p.vk===2?.15:.7):0}
  if(p!==me){const k=Math.min(1,dt*14);p.x+=(p.tx-p.x)*k;p.z+=(p.tz-p.z)*k;continue}
  const ctl=p.st==='ok'&&!(p.vt>0)&&!(p.stun>0)&&!(p.brk>0);
  if(!ctl){const k=Math.min(1,dt*16);p.x+=(p.tx-p.x)*k;p.z+=(p.tz-p.z)*k;continue}
  const l=Math.hypot(c.x,c.z),still=!p.killer&&c.ih&&(G.gens.some(g=>!g.done&&d2(p,g)<7)||(p.item&&G.deps.some(d=>d2(p,d)<12))||G.P.some(q=>q.st==='hung'&&q.hangs<3&&d2(p,G.pikes[q.pike])<8));
  if(p.mw){const sp=speedOf(p);p.x+=Math.sin(p.mwd)*sp*dt;p.z+=Math.cos(p.mwd)*sp*dt;res(p)}else if(l>.05&&!still){const sp=speedOf(p),k=Math.min(1,l);p.x+=c.x/l*k*sp*dt;p.z+=c.z/l*k*sp*dt;if(!p.killer)p.face=Math.atan2(c.x,c.z);res(p)}
  const er=Math.hypot(p.tx-p.x,p.tz-p.z);if(er>3){p.x=p.tx;p.z=p.tz}else{const k=Math.min(1,dt*((l>.05&&!still)||p.mw?.4:6));p.x+=(p.tx-p.x)*k;p.z+=(p.tz-p.z)*k}}}
